name: test

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    unix:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Install jq on macOS
              if: runner.os == 'macOS'
              run: command -v jq || brew install jq
            - name: Run installer tests
              run: bash tests/install_test.sh
            - name: Run release asset tests
              run: bash tests/release_assets_test.sh

    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Run installer tests (Windows PowerShell 5.1)
              shell: powershell
              run: ./tests/install_test.ps1
            - name: Run installer tests (PowerShell 7)
              shell: pwsh
              run: ./tests/install_test.ps1

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Run shellcheck
              run: shellcheck install.sh uninstall.sh hooks/inject.sh hooks/alert.sh statusline/claude-statusline.sh tests/install_test.sh scripts/build-release-assets.sh tests/release_assets_test.sh
